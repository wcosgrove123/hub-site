</button> <div class="tool-seg" role="group" aria-label="Color scheme"> <button type="button" data-scheme-set="light" aria-pressed="false">Day</button> <button type="button" data-scheme-set="dark" aria-pressed="false">Night</button> </div> </div> </div> </header> <main id="main" tabindex="-1" class="wide">  <div class="rv-band rv-head"> <div class="rv-wrap"> <a class="rv-back" href="/hub-site/#play">All games</a> <h1 tabindex="-1">Trap Spotter</h1>   <div class="rv-stats-inline"> <span>Statement<b><span id="ts-round">1</span> of 10</b></span> <span class="rv-only-solo">Score<b id="ts-score">0</b></span> <span class="rv-only-solo">Streak<b id="ts-streak">0</b></span> </div>  </div> </div> <div class="rv-wrap rv-game"> <div> <div id="ts-play"> <div class="rv-card"> <div class="rv-timer" id="ts-timer" hidden><div class="tbar"><i></i></div><span class="lab"></span></div> <p class="rv-k" id="ts-about">Slaveholding in the South</p> <p class="rv-prompt" id="ts-statement">Most white Southerners owned slaves.</p> <div class="rv-ts-answers" id="ts-answers"> <button class="rv-btn is-big" type="button" id="ts-true"><span>True</span><kbd>1</kbd></button> <button class="rv-btn is-big" type="button" id="ts-trap"><span>Trap</span><kbd>2</kbd></button> </div> <div id="ts-reveal" hidden></div> </div> <div class="rv-controls"> <button class="rv-btn is-primary" type="button" id="ts-revealbtn" hidden><span>Reveal</span><kbd>Enter</kbd></button> <button class="rv-btn is-primary" type="button" id="ts-next" hidden><span>Next statement</span><kbd>Enter</kbd></button> <p class="rv-keys" id="ts-hint">Press 1 for True or 2 for Trap.</p> </div> </div> <div id="ts-done" hidden></div> </div> <aside class="rv-pods" hidden aria-label="Pod scores" data-periods="P4,P7"></aside> </div> <script type="application/json" id="ts-data">{"traps":[["Slaveholding in the South","Most white Southerners owned slaves.","About one in four white Southern families held enslaved people in 1860; most were non-slaveholding yeomen.","CED KC-4.3.II.B.ii says so directly.","4.13"],["Compromise of 1850","The Compromise of 1850 drew a new line like 36°30′.","It drew no line: California entered free, and Utah and New Mexico were organized without a ban on slavery.","Look for “popular sovereignty,” not a latitude.","5.4"],["Kansas-Nebraska Act","The Kansas-Nebraska Act was another compromise.","It erased the Missouri Compromise line and blew up the old balance.","Ask who gave up what. The North gave up the 1820 line and got nothing back.","5.6"],["Dred Scott v. Sandford","Dred Scott backed up popular sovereignty.","It said slave property could not be kept out of any territory, which undercut popular sovereignty; Douglas's Freeport Doctrine was a workaround.","Who decides? Dred Scott answered: no one can bar slavery.","5.6"],["Republicans in 1860","The Republicans of 1860 promised to abolish slavery.","They opposed slavery's spread into the territories; Lincoln promised not to touch it in the states.","Free soil is not abolition.","5.7"],["Free Soilers","Free Soilers were abolitionists.","Many wanted the West kept for white farmers and workers, sometimes with no Black people at all.","CED KC-5.2.I.A: some did not object to slavery on principle.","5.4"],["Abolitionists in the North","Most Northerners were abolitionists.","Abolitionists were a minority; Northern mobs attacked them too.","Elijah Lovejoy (1837); the mob that dragged Garrison through Boston (1835).","4.11"],["Wilmot Proviso","The Wilmot Proviso became law.","It passed the House and died in the Senate.","Its importance is the sectional vote, not a result.","5.3"],["Fugitive Slave Act of 1850","The Fugitive Slave Act only affected people who had escaped.","It made Northerners liable to help, denied the accused a jury, and put free Black people at risk.","Anthony Burns (1854); Solomon Northup's kidnapping shows the danger.","5.4"],["Uncle Tom's Cabin and the Underground Railroad","Uncle Tom's Cabin started the Underground Railroad.","The network had run for decades; the novel changed how Northerners felt.","Check the dates: 1830s network, 1852 novel.","5.4"],["Nativists","Nativists were against all immigrants equally.","Their main target was Catholics, above all the Irish.","CED KC-5.1.II.B: a strongly anti-Catholic movement.","5.5"],["Manifest Destiny","Manifest Destiny was a law or an official policy.","It was an idea, named by a newspaper editor in 1845; presidents and Congress acted on it.","Ask who said it and where.","5.2"],["The war with Mexico","Everyone supported the war with Mexico.","Whigs like Lincoln, abolitionists like Douglass, and writers like Thoreau opposed it.","The Spot Resolutions; “War with Mexico” (1848).","5.3"],["Seneca Falls Convention","Seneca Falls was only about the vote.","The Declaration of Sentiments listed many grievances: property, wages, education, church and divorce; the vote was the most debated.","Read the list of grievances.","4.11"],["The South and industry","The South had no industry at all.","It had some, such as the Tredegar Iron Works, but far less than the North; profits went into land and enslaved people.","Compare factories, railroads and immigrants, North and South.","4.13"],["States' rights","States' rights was the South's consistent principle.","Slaveholders demanded federal power to capture people who escaped; Northern states used states' rights against the Fugitive Slave Act.","Ableman v. Booth (1859).","5.5"],["Secession after Lincoln's election","Every Southern state seceded right after Lincoln won.","Seven Deep South states left before his inauguration, four more after Fort Sumter, and four slave states never left.","Two waves, plus the border states.","5.7"],["Dred Scott's case","Dred Scott won his freedom in court.","The Court ruled against him; his owners' family freed him later in 1857.","Read the outcome, not just the issue.","5.6"],["Lincoln in 1860","Lincoln campaigned everywhere in 1860.","He was not on the ballot in ten slave states.","Look at the electoral map.","5.7"],["Second Great Awakening","The Second Great Awakening turned people away from religion.","It was a Protestant revival; it turned away from rationalism and Deism.","Camp meetings and Finney's revivals.","4.10"],["Reform movements","Reform movements were run by the government.","Most reform worked through voluntary organizations; laws such as the Maine Law and new school boards came later.","CED KC-4.1.III: mostly outside of government.","4.11"],["Mexicans in the Cession","Mexicans in the Mexican Cession were denied citizenship.","The treaty offered citizenship, but many lost land and rights in practice.","California Land Act (1851); Vallejo's memoir.","5.3"]]}</script>  </main> <footer class="site-footer"> <div class="bar">  <p>No account, and nothing goes to a server. Grades and due dates live in Canvas.</p> </div> </footer> <script type="module">const e=document.documentElement,a=document.getElementById("class-toggle"),r=()=>a?.setAttribute("aria-pressed",e.getAttribute("data-projector")==="on"?"true":"false");r();a?.addEventListener("click",()=>{const t=e.getAttribute("data-projector")!=="on";t?e.setAttribute("data-projector","on"):e.removeAttribute("data-projector");try{localStorage.setItem("hub.projector",t?"on":"off")}catch{}r(),document.dispatchEvent(new CustomEvent("hub:classmode",{detail:t}))});const n=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null,d=Array.from(document.querySelectorAll("[data-scheme-set]")),o=()=>{const t=e.getAttribute("data-scheme"),s=t==="light"||t==="dark"?t:n?.matches?"dark":"light";for(const c of d)c.setAttribute("aria-pressed",c.dataset.schemeSet===s?"true":"false")};o();n?.addEventListener?.("change",o);for(const t of d)t.addEventListener("click",()=>{const s=t.dataset.schemeSet==="dark"?"dark":"light";e.setAttribute("data-scheme",s);try{localStorage.setItem("hub.scheme",s)}catch{}o()});</script> </body> </html> <script type="module" src="/hub-site/_astro/trap-spo
